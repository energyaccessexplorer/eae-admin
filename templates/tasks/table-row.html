<tr>
  <td bind="name"></td>

  <td>
     <span class="bi-empty"
           bind-cond="_not_running"></span>

     <span class="bi-x-lg"
           bind-cond="_failed"
           style="color: red;"></span>

     <span class="bi-check-lg"
           bind-cond="_running"
           style="color: green;"></span>
  </td>

  <td>
    <pre bind="infos"></pre>
  </td>

  <td>
    <span bind="interval"></span> seconds
  </td>

  <td bind="last-run"></td>
</tr>
