<tr bind-attr-class="ok"
    bind-not="disabled">
  <td title="edit">
    <a dt-edit class="bi-pencil-fill"></a>
  </td>

  <td>
    <span bind="name"></span>
  </td>

  <td>
    <span bind="category_name"></span>
  </td>

  <td>
    <span bind="geography_name"></span>
  </td>

  <td style="font-family: monospace;">
    <span bind="type"></span>
  </td>

  <td>
    <span title="private"
          class="bi-lock"
          bind-cond="private"></span>
  </td>

  <td>
    <span title="deployed in production"
          class="bi-globe2"
          bind-cond="inproduction"></span>

    <span title="NOT deployed in production"
          class="bi-empty"
          bind-unless="inproduction"></span>
  </td>

  <td>
    <span title="deployed in staging"
          class="bi-box2"
          bind-cond="instaging"></span>

    <span title="NOT deployed in staging"
          class="bi-empty"
          bind-unless="instaging"></span>
  </td>

  <td>
    <span title="deployed in training"
          class="bi-bounding-box-circles"
          bind-cond="intraining"></span>

    <span title="NOT deployed in training"
          class="bi-empty"
          bind-unless="intraining"></span>
  </td>

  <td>
    <span title="deployed in test"
          class="bi-test"
          bind-cond="intest"></span>

    <span title="NOT deployed in test"
          class="bi-empty"
          bind-unless="intest"></span>
  </td>

  <td>
    <span class="bi-braces"
          title="deployed in dev"
          bind-cond="indev"></span>

    <span title="NOT deployed in dev"
          class="bi-empty"
          bind-unless="indev"></span>
  </td>

  <td style="text-align: center; font-family: monospace;">
    <span bind="content_date"></span>
  </td>

  <td class="updated">
    <span bind-arg="updated"
          bind-lambda="human_time"></span>

    <span bind-arg="updated_by"
          bind-lambda="email_user"
          bind-format="({0})"></span>
  </td>
</tr>
