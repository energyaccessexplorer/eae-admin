<form id="form-"
      style="text-align: right;">
  <div class="input-group">
    <label>attribute</label>

    <input name="attr"
           type="text"
           required />
  </div>

  <div class="input-group">
    <label>lng/lat columns</label>

    <input name="lnglat"
           type="text"
           placeholder="longitude,latitude"
           pattern="^[a-zA-Z]+,[a-zA-Z]+$"
           required>
  </div>
</form>
